const ls={get(k){try{return localStorage.getItem(k)}catch(x){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(x){}},del(k){try{localStorage.removeItem(k)}catch(x){}}};
async function derive(code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code.toUpperCase().replace(/[^A-Z0-9]/g,"")),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b(P.s),iterations:P.n,hash:"SHA-256"},base,256));
}
async function unlock(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},k,b(P.c));
  let d=null;try{d=JSON.parse(ls.get("trip-device"))}catch(x){}
  d=d||{first:new Date().toISOString(),ua:navigator.userAgent,count:0};d.count=(d.count||0)+1;d.last=new Date().toISOString();
  ls.set("trip-device",JSON.stringify(d));
  document.open();document.write(new TextDecoder().decode(pt));document.close();
}
(async()=>{
  const saved=ls.get("trip-unlock");
  if(saved){try{await unlock(b(saved));return}catch(x){ls.del("trip-unlock")}}
  document.getElementById("box").hidden=false;
  document.getElementById("f").onsubmit=async ev=>{
    ev.preventDefault();const err=document.getElementById("err");err.textContent="验证中…";
    try{const raw=await derive(document.getElementById("c").value);await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(k=>crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},k,b(P.c)));
      ls.set("trip-unlock",e(raw));await unlock(raw);}
    catch(x){err.textContent="验证码不对，请重试";}
  };
})();
</script></body></html>
