async function derive(code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code.toUpperCase().replace(/[^A-Z0-9]/g,"")),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b(P.s),iterations:P.n,hash:"SHA-256"},base,256));
}
async function unlock(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},k,b(P.c));

  document.open();document.write(new TextDecoder().decode(pt));document.close();
}
